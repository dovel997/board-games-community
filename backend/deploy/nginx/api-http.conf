# TEMPORARY test config: serves the API over plain HTTP on the server's IP.
# Use it to check the first deploy (http://<VPS-IP>/api/health), then switch to api.conf.
# Install: /etc/nginx/sites-available/board-games-api  (see docs/vps-backend-deployment.md)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
