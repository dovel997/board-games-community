# Production config: https://api.example.com behind the Cloudflare proxy.
# Replace api.example.com (3 places) with your API hostname.
# Install: /etc/nginx/sites-available/board-games-api  (see docs/vps-backend-deployment.md)

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # Cloudflare Origin Certificate (SSL/TLS mode "Full (strict)")
    ssl_certificate     /etc/ssl/cloudflare/api.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr is the real visitor IP once cloudflare-real-ip.conf is installed.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}
