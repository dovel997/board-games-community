name: Backend — test, build image & deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# PR runs: one group per PR, a new push cancels the old run.
# Deploys: queued, never cancelled.
concurrency:
  group: backend-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('deploy-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

  build-image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      # GHCR image names must be lowercase.
      - name: Image name
        id: name
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "base=ghcr.io/${repo}-api" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.base }}:latest
          build-args: |
            APP_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
      APP_DIR: /opt/board-games
    steps:
      - uses: actions/checkout@v6

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Fail on unknown or changed host keys instead of trusting them blindly.
          printf 'Host *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n' > ~/.ssh/config

      - name: Copy deploy files
        run: |
          scp -P "$SSH_PORT" backend/deploy/docker-compose.yml backend/deploy/deploy.sh "$SSH_TARGET:$APP_DIR/"

      # Log in with this job's short-lived token, pull, then log out again,
      # so no long-lived registry credentials stay on the server.
      - name: Deploy
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh -p "$SSH_PORT" "$SSH_TARGET" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh -p "$SSH_PORT" "$SSH_TARGET" \
            "bash $APP_DIR/deploy.sh '${{ needs.build-image.outputs.image }}' '${{ github.sha }}'"

      - name: Log out of registry
        if: always()
        run: ssh -p "$SSH_PORT" "$SSH_TARGET" "docker logout ghcr.io" || true

      - name: Summary
        run: |
          echo "### Deployed backend" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ needs.build-image.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
