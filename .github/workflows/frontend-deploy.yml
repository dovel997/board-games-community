name: Frontend — build & deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# PR runs get their own group per PR (a new push cancels the old PR run).
# Production deploys queue in their own group and are never cancelled.
# Note: when a PR is merged, its "closed" event reports github.ref as main,
# so the group must not be based on github.ref alone.
concurrency:
  group: frontend-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('deploy-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  build-and-deploy:
    # Skip when a PR is closed — the cleanup job below handles that.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # main (or a manual run) → production
      - name: Deploy to production
        id: deploy
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy

      # Pull request → preview URL. Forks get no secrets, so they only build and test.
      # Worker Previews are in open beta and need the Worker to exist (after the first
      # production deploy), so a failure here doesn't fail the check.
      - name: Deploy preview
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: preview --name pr-${{ github.event.pull_request.number }}

      - name: Show deployment output
        if: steps.deploy.outcome == 'success' || steps.preview.outcome == 'success'
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output || steps.preview.outputs.command-output }}
        run: |
          {
            echo '### Cloudflare deployment'
            echo '```'
            echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  delete-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Delete PR preview
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: preview delete --name pr-${{ github.event.pull_request.number }} --skip-confirmation
